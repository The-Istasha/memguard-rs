[package]
name = "memguard-rs"
version = "0.1.0"
edition = "2021"
rust-version = "1.65"
authors = ["Istasha <67969809+The-Istasha@users.noreply.github.com>"]
license = "MIT OR Apache-2.0"
description = "Secure memory handling primitives for Rust — zeroization on drop, mlock-protected regions, constant-time comparison, and compile-time enforced memory safety boundaries"
repository = "https://github.com/The-Istasha/memguard-rs"
homepage = "https://github.com/The-Istasha/memguard-rs"
documentation = "https://docs.rs/memguard-rs"
keywords = ["security", "memory", "crypto", "mlock", "zeroize", "secret", "no-std"]
categories = ["cryptography", "memory-management", "no-std"]
readme = "README.md"
exclude = ["/.github", "/target", "/tests"]

[features]
default = ["std", "lock"]
std = ["alloc"]
alloc = []
lock = []

[[bench]]
name = "bench"
harness = false
path = "benches/bench.rs"

[dev-dependencies]
criterion = "0.5" # Note: 0.5 is latest compatible with MSRV 1.65

[[bench]]
name = "bench"
harness = false
path = "benches/bench.rs"

[dev-dependencies]
criterion = "0.5" # Note: 0.5 is latest compatible with MSRV 1.65
